[project]
name = "lunar-traverse-planner"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy", "rasterio", "matplotlib"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
